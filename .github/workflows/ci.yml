name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type check · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build-time env vars are required for Next.js to compile — provide
      # placeholder values so the type-check and lint steps don't fail on
      # missing NEXT_PUBLIC_* imports.
      - name: Type check
        run: bunx tsc --noEmit
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.pdfvault.ai
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.pdfvault.ai
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
