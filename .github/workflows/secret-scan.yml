name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can resolve commit ranges. On
          # `pull_request` events, actions/checkout defaults to the
          # merge-preview ref (`refs/pull/N/merge`) — `ref` below
          # forces the PR head commit so `<sha>^..<sha>` ranges
          # gitleaks-action constructs actually exist in the local
          # git history. Without this, gitleaks fails with
          # `fatal: ambiguous argument '<sha>^..<sha>': unknown
          # revision or path not in the working tree.` See Aug 2026
          # gitleaks-action issue thread.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
