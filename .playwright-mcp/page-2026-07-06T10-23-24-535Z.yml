      - generic [ref=e33]:
        - generic [ref=e34]:
          - heading "Introduction" [level=2] [ref=e35]
          - paragraph [ref=e36]: Content Clicks LLC ("we," "us," or "our") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, and protect your personal information when you use our Service at pdfedits.io.
        - generic [ref=e37]:
          - heading "Information We Collect" [level=2] [ref=e38]
          - paragraph [ref=e39]: "Information you provide directly:"
          - list [ref=e40]:
            - listitem [ref=e41]: Account registration details (name, email address, password hash).
            - listitem [ref=e42]: Payment information (processed and stored by our payment processor; we do not store full card details).
            - listitem [ref=e43]: Communications you send us (support tickets, emails).
          - paragraph [ref=e44]: "Information collected automatically:"
          - list [ref=e45]:
            - listitem [ref=e46]: "Log data: IP address, browser type, pages visited, timestamps, referring URLs."
            - listitem [ref=e47]: "Device information: operating system, screen resolution, language settings."
            - listitem [ref=e48]: "Usage data: features used, file types processed (not file contents), session duration."
            - listitem [ref=e49]:
              - text: Cookies and similar tracking technologies (see
              - link "Cookie Policy" [ref=e50] [cursor=pointer]:
                - /url: /cookies
              - text: ).
          - generic [ref=e52]:
            - paragraph [ref=e53]: "What we do NOT collect:"
            - paragraph [ref=e55]: The contents of your uploaded files. Files are processed in memory and not permanently stored beyond the session unless you explicitly save them to your account.
        - generic [ref=e56]:
          - heading "How We Use Your Information" [level=2] [ref=e57]
          - paragraph [ref=e58]: "We use your information to:"
          - list [ref=e59]:
            - listitem [ref=e60]: Provide, maintain, and improve the Service.
            - listitem [ref=e61]: Process payments and manage subscriptions.
            - listitem [ref=e62]: Send transactional emails (receipts, renewal reminders, service updates).
            - listitem [ref=e63]: Respond to support requests.
            - listitem [ref=e64]: Analyze usage patterns to improve user experience (using anonymized/aggregated data).
            - listitem [ref=e65]: Comply with legal obligations.
            - listitem [ref=e66]: Detect and prevent fraud or abuse.
        - generic [ref=e67]:
          - heading "Legal Basis for Processing (GDPR)" [level=2] [ref=e68]
          - paragraph [ref=e69]: "For users in the European Economic Area, our legal bases are:"
          - list [ref=e70]:
            - listitem [ref=e71]: "Performance of a contract: to provide you with the Service."
            - listitem [ref=e72]: "Legitimate interests: for security, fraud prevention, and service improvement."
            - listitem [ref=e73]: "Legal obligation: to comply with applicable laws."
            - listitem [ref=e74]: "Consent: for marketing communications and non-essential cookies (which you may withdraw at any time)."
        - generic [ref=e75]:
