            - text: Your data may be processed in countries outside your own. Where we transfer data internationally, we ensure appropriate safeguards (e.g.,
            - strong [ref=e97]: Standard Contractual Clauses
            - text: for EEA transfers) are in place.
        - generic [ref=e98]:
          - heading "Your Rights" [level=2] [ref=e99]
          - paragraph [ref=e100]: "Depending on your location, you may have the right to:"
          - list [ref=e102]:
            - listitem [ref=e103]:
              - strong [ref=e104]: Access
              - text: — Request a copy of the personal data we hold about you.
            - listitem [ref=e105]:
              - strong [ref=e106]: Rectification
              - text: — Correct inaccurate or incomplete data.
            - listitem [ref=e107]:
              - strong [ref=e108]: Erasure
              - text: — Request deletion of your personal data ("right to be forgotten").
            - listitem [ref=e109]:
              - strong [ref=e110]: Restriction
              - text: — Request that we limit how we process your data.
            - listitem [ref=e111]:
              - strong [ref=e112]: Portability
              - text: — Receive your data in a machine-readable format.
            - listitem [ref=e113]:
              - strong [ref=e114]: Object
              - text: — Object to processing based on legitimate interests.
            - listitem [ref=e115]:
              - strong [ref=e116]: Withdraw consent
              - text: — For processing based on consent, at any time.
            - listitem [ref=e117]:
              - strong [ref=e118]: Lodge a complaint
              - text: — With your local data protection authority.
          - paragraph [ref=e122]:
            - text: To exercise any of these rights, contact us at
            - link "support@pdfedits.io" [ref=e123] [cursor=pointer]:
