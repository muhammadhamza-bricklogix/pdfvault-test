          - paragraph [ref=e79]: We do not sell your personal data.
          - paragraph [ref=e80]: "We may share data with:"
          - list [ref=e81]:
            - listitem [ref=e82]: Service providers (payment processors, email providers, hosting providers) who are contractually bound to protect your data.
            - listitem [ref=e83]: Analytics providers (using anonymized data only).
            - listitem [ref=e84]: Law enforcement or regulatory authorities when required by law.
            - listitem [ref=e85]: Successors in the event of a merger, acquisition, or sale of assets (with advance notice to you).
        - generic [ref=e86]:
          - heading "Data Retention" [level=2] [ref=e87]
          - list [ref=e88]:
            - listitem [ref=e89]: Account data is retained for as long as your account is active.
            - listitem [ref=e90]: Uploaded file data is not retained beyond the processing session (unless explicitly saved to your account).
            - listitem [ref=e91]: Payment records are retained as required by financial and tax regulations.
            - listitem [ref=e92]: Log data is retained for up to 90 days.
          - paragraph [ref=e93]: You may request deletion of your account and associated data at any time (see Your Rights).
        - generic [ref=e94]:
          - heading "International Data Transfers" [level=2] [ref=e95]
